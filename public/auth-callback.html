<script>
  // Vuelta del inicio de sesión de Microsoft: pasa el resultado a la ventana de DíasLibres y se cierra.
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({ authHash: location.hash }, location.origin);
    window.close();
  } else {
    location.replace('/');
  }
</script>
